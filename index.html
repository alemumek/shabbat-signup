<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>שבת וחג אצל ההורים 🍷</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>שבת וחג אצל ההורים 🍷</h1>
      <p class="subtitle">תיאום והרשמה לשבט מקונן</p>
    </header>

    <!-- טופס הרשמה ועריכה -->
    <section class="card form-card" id="formCard">
      <div id="editBanner" class="edit-banner" style="display: none;">
        ✏️ מצב עריכה פעיל
      </div>
      
      <form id="signupForm">
        <input type="hidden" id="editId" value="">
        
        <div class="form-group">
          <label for="name">שם המשפחה / הזוג:</label>
          <input type="text" id="name" placeholder="לדוגמה: תמר ותומר" required>
        </div>

        <div class="form-group">
          <label for="date">תאריך סופ"ש / חג:</label>
          <input type="date" id="date" required>
          <div id="dateError" class="error-msg" style="display: none;"></div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">אישור הרשמה</button>
          <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;" onclick="cancelEdit()">ביטול</button>
        </div>
      </form>

      <div id="formStatus" class="form-status"></div>

      <!-- מכולת שיתוף ב-WhatsApp -->
      <div id="whatsappContainer" class="whatsapp-container" style="display: none;">
        <p>ההרשמה נשמרה בהצלחה! שתף בקבוצה המשפחתית:</p>
        <a id="whatsappShareBtn" href="#" target="_blank" class="btn btn-whatsapp">
          💬 שיתוף ב-WhatsApp
        </a>
      </div>
    </section>

    <!-- ניווט בלשיות -->
    <nav class="tabs-nav">
      <button class="tab-btn active" id="tabFuture" onclick="switchTab('future')">שבתות וחגים קרובים</button>
      <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">אירועים שהיו</button>
    </nav>

    <!-- תצוגת רשימות -->
    <main>
      <section id="futureView" class="tab-content active">
        <div id="futureList" class="registrations-list">
          <div class="loading">טוען נתונים...</div>
        </div>
      </section>

      <section id="historyView" class="tab-content" style="display: none;">
        <div id="historyList" class="registrations-list">
          <div class="loading">טוען נתונים...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
