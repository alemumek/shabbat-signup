<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שבת וחג אצל ההורים</title>
<meta name="description" content="תיאום ארוחות שבת וחג">
<meta name="theme-color" content="#26337A">
<link rel="manifest" href="manifest.web_manifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-apple.png">
<link rel="preload" href="fonts/rubik-hebrew-400.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* ערכת נושא לפני הציור הראשון: בלי הבהוב */
try { var t = localStorage.getItem('shabbat.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* localStorage חסום */ }
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M10 2.5c-2.2 2.4-2.2 4.8 0 6.6c2.2-1.8 2.2-4.2 0-6.6Z" fill="#E3BE62"/><path d="M22 2.5c-2.2 2.4-2.2 4.8 0 6.6c2.2-1.8 2.2-4.2 0-6.6Z" fill="#E3BE62"/><rect x="8" y="11" width="4" height="14" rx="1" fill="#F2ECDD"/><rect x="20" y="11" width="4" height="14" rx="1" fill="#F2ECDD"/><rect x="3" y="25" width="26" height="3.5" rx="1.75" fill="#E3BE62"/></svg>
      <h1>שבת וחג אצל ההורים</h1>
    </div>
    <button type="button" id="themeBtn" class="icon-btn" aria-label="ערכת נושא: אוטומטי. לחצו למעבר לבהיר">
      <svg id="icoAuto" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></svg>
      <svg id="icoLight" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
      <svg id="icoDark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
  </header>

  <div id="installRow" class="install-row" hidden>
    <button type="button" id="installBtn" class="btn btn-secondary">הוספה למסך הבית</button>
  </div>

  <noscript><p class="state is-error">האפליקציה דורשת הפעלת JavaScript.</p></noscript>

  <form id="regForm" class="card form-card" novalidate>
    <div class="gold-line"></div>
    <p id="editBanner" class="edit-banner" hidden>מצב עריכה פעיל</p>
    <label class="field-label" for="nameInput">שם המשפחה</label>
    <input id="nameInput" class="input" type="text" maxlength="40" autocomplete="off" placeholder="למשל: משפחת כהן / ישראל ורחל">

    <fieldset class="picker">
      <legend>בחירת שבת/חג <small id="pickerHint">· אפשר לסמן כמה</small></legend>
      <div id="events" class="events"></div>
      <div id="moreRow" class="more-row"></div>
    </fieldset>

    <div class="actions">
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">הרשמה</button>
      <button type="button" id="cancelBtn" class="btn btn-secondary btn-block" hidden>ביטול</button>
    </div>
    <p id="formMsg" class="msg" role="status"></p>
    <p id="formErr" class="msg msg-error" role="alert"></p>
    <div id="share" class="share" hidden>
      <p>ההרשמה נשמרה! שתפו בקבוצה המשפחתית:</p>
      <a id="waLink" class="btn btn-wa" href="#" target="_blank" rel="noopener">שיתוף ב-WhatsApp</a>
    </div>
  </form>

  <p id="notice" class="msg msg-info" role="status"></p>

  <div class="tabs" role="tablist" aria-label="הרשמות">
    <button type="button" class="tab" role="tab" id="tab-future" aria-selected="true" aria-controls="panel-future">שבתות וחגים קרובים</button>
    <button type="button" class="tab" role="tab" id="tab-past" aria-selected="false" aria-controls="panel-past" tabindex="-1">אירועים שהיו</button>
  </div>
  <div id="panel-future" class="list" role="tabpanel" aria-labelledby="tab-future"></div>
  <div id="panel-past" class="list" role="tabpanel" aria-labelledby="tab-past" hidden></div>

  <footer class="foot"><span id="clientVer"></span><span id="serverVer"></span></footer>
</div>

<dialog id="delDialog" aria-labelledby="delTitle" aria-describedby="delMsg">
  <h2 id="delTitle">מחיקת הרשמה</h2>
  <p id="delMsg"></p>
  <p id="delErr" class="msg msg-error" role="alert"></p>
  <div class="dialog-actions">
    <button type="button" id="delConfirm" class="btn btn-danger">מחיקה</button>
    <button type="button" id="delCancel" class="btn btn-secondary">ביטול</button>
  </div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
